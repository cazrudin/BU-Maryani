    <script>
      // Filter benign Vite websocket disconnection messages in dev environment
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('vite-plugin-pwa'))) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
